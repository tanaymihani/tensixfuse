[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensixfuse"
version = "0.1.0"
description = "Fused and block-float ML kernels for Tenstorrent Tensix cores, checked on Tenstorrent's simulators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tanay Mihani" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sim = ["tt-lang-sim==1.1.6"]
dev = ["tt-lang-sim==1.1.6", "pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: runs kernels on TT-Lang's functional simulator (slower)",
    "ttsim: needs ttsim and the ttnn wheel (Linux x86_64 only)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# TT-Lang kernels keep the tutorial's nested `with` style, and the pipe
# callbacks read loop variables on purpose: if_src/if_dst call them right away.
"kernels/**" = ["SIM117", "B023"]
