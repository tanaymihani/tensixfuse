# GPT-2 block-float study and GPU-CorruptNet's head on ttsim; they write
# results/quant_gpt2.json and results/corruptnet_head.json.
name: studies

on:
  push:
    branches: [main]
    paths:
      - "bench/quant_gpt2.py"
      - "bench/corruptnet_head.py"
      - "model/**"
      - ".github/workflows/studies.yml"
  workflow_dispatch:

env:
  TTNN_VERSION: "0.79.0"

jobs:
  quant:
    name: GPT-2 block-float study (Blackhole)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ttnn, CPU torch, transformers
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION"
          pip install transformers datasets "numpy<2"
          pip install --no-deps -e .
      - run: bash scripts/install_sfpi.sh
      - run: bash scripts/setup_ttsim.sh blackhole
      - name: Capture GPT-2 MLP inputs and outputs (CPU)
        run: python model/gpt2_capture.py --out data/gpt2_mlp.npz
      - name: Block-float weights and math fidelity on ttsim
        run: python bench/quant_gpt2.py --data data/gpt2_mlp.npz --out results/quant_gpt2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-gpt2
          path: results/

  head:
    name: GPU-CorruptNet head (Blackhole)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ttnn and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION"
          pip install --no-deps -e .
      - run: bash scripts/install_sfpi.sh
      - run: bash scripts/setup_ttsim.sh blackhole
      - run: bash scripts/fetch_data.sh
      - run: python bench/corruptnet_head.py --data data/corruptnet.npz --out results/corruptnet_head.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corruptnet-head
          path: results/
