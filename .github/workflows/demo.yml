# Records docs/img/demo.gif from docs/demo.tape against the published image.
name: demo

on:
  push:
    branches: [main]
    paths:
      - "docs/demo.tape"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull the image first, so the recording doesn't show the download
        run: docker pull ghcr.io/tanaymihani/tensixfuse:latest
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: docs/img/demo.gif
