name: ttsim

# The same tests on simulated Wormhole and Blackhole chips, one job per chip and
# weight format. Runs on pushes and PRs that touch kernels, code or the pins,
# and weekly: the pinned stack should still install and pass, and the newest
# ttsim release is tried against it (that job reports, it doesn't fail the run).
on:
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - "src/**"
      - "scripts/**"
      - "tests/test_ttsim.py"
      - "bench/baselines.json"
      - "ttsim-version"
      - "ttsim.sha256"
      - "sfpi-version"
      - ".github/workflows/ttsim.yml"
  pull_request:
    paths:
      - "kernels/**"
      - "src/**"
      - "tests/test_ttsim.py"
      - "bench/baselines.json"
      - "ttsim-version"
      - "sfpi-version"
      - ".github/workflows/ttsim.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

env:
  TTNN_VERSION: "0.79.0"

jobs:
  ttsim:
    name: ${{ matrix.arch }} / ${{ matrix.format }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole]
        format: [bfloat16, bfloat8_b, bfloat4_b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ttnn and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION" pytest
          pip install --no-deps -e .
      - name: Cache SFPI and ttsim
        uses: actions/cache@v4
        with:
          path: ~/.cache/tensixfuse
          key: ttsim-${{ hashFiles('ttsim-version', 'ttsim.sha256') }}-${{ matrix.arch }}
      - run: bash scripts/install_sfpi.sh
      - run: bash scripts/setup_ttsim.sh ${{ matrix.arch }}
      - name: Tests on simulated ${{ matrix.arch }}
        env:
          TENSIXFUSE_FORMATS: ${{ matrix.format }}
        run: pytest -q -m ttsim tests/test_ttsim.py

  newest-ttsim:
    name: newest ttsim release / ${{ matrix.arch }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # The pinned tests take a few minutes per chip. On Oct 30, ttsim v1.15.0
    # didn't finish the Blackhole tests in 45 (Wormhole passed in 14 s).
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ttnn and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION" pytest
          pip install --no-deps -e .
      - run: bash scripts/install_sfpi.sh
      - name: Point the pin at the newest ttsim release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo tenstorrent/ttsim --json tagName --jq .tagName)"
          lib="$([ "${{ matrix.arch }}" = wormhole ] && echo libttsim_wh.so || echo libttsim_bh.so)"
          curl -fsSL --retry 3 -o "/tmp/$lib" "https://github.com/tenstorrent/ttsim/releases/download/$tag/$lib"
          echo "$(sha256sum "/tmp/$lib" | cut -d' ' -f1)  $lib" > ttsim.sha256
          echo "$tag" > ttsim-version
          echo "ttsim $tag against ttnn $TTNN_VERSION (pinned ttsim: $(git show HEAD:ttsim-version))" >> "$GITHUB_STEP_SUMMARY"
      - run: bash scripts/setup_ttsim.sh ${{ matrix.arch }}
      - name: Tests on simulated ${{ matrix.arch }}
        run: pytest -q -m ttsim tests/test_ttsim.py
