name: ttsim bring-up

on:
  push:
    branches: [sim-bringup]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ttnn and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ttnn==0.79.0
          pip list | grep -iE "^(ttnn|torch|numpy) "
      - name: Install SFPI
        run: |
          bash scripts/install_sfpi.sh
          SFPI=$(python -c "import os, ttnn; print(os.path.join(os.path.dirname(ttnn.__file__), 'runtime', 'sfpi'))")
          ls "$SFPI" | head; ls "$SFPI"/compiler/bin 2>/dev/null | head -n 5
      - name: Set up ttsim
        run: bash scripts/setup_ttsim.sh ${{ matrix.arch }}
      - name: Smoke test
        run: python scripts/ttsim_smoke.py
