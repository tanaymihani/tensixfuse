name: scaleout

# GPT-2's MLP tensor-parallel across the two chips of a simulated N300 (ttsim's
# 2-chip Wormhole build): c_fc split by columns, c_proj by rows. By default each
# chip's partial sum comes back to the host, which adds them. With `fabric`, the
# chips all-reduce over tt-metal's fabric instead, which doesn't work yet: with
# tt-umd's N300 example file as the topology, the first host write to the
# second chip times out once the fabric is up (see bench/tp_mlp_n300.py).
# Manual: on the pinned ttsim each block takes about 160 s.
on:
  workflow_dispatch:
    inputs:
      ttsim:
        description: "ttsim release to use instead of the pinned one, e.g. v1.16.0 (empty: the pin)"
        required: false
        default: ""
      fabric:
        description: "all-reduce on the chips over tt-metal's fabric instead of adding the partials on the host"
        type: boolean
        default: false
      discover:
        description: "let UMD find the two simulated chips itself instead of reading tt-umd's N300 example file"
        type: boolean
        default: false
      blocks:
        description: "GPT-2 MLP blocks to run"
        required: false
        default: "0 6 11"
      minutes:
        description: "job time limit; with the fabric on, one block takes more than an hour"
        required: false
        default: "60"

env:
  TTNN_VERSION: "0.81.1"
  # tt-umd as pinned by tt-metal v0.81.1 (tt_metal/third_party/umd)
  UMD_SHA: 889651ea5525379cc6bf1807e56404661b48a76d

jobs:
  n300:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ fromJSON(inputs.minutes || '60') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION"
          pip install transformers datasets "numpy<2" "pyarrow<26"  # ttnn needs numpy<2; pyarrow 26 needs numpy 2
          pip install --no-deps -e .
      - run: bash scripts/install_sfpi.sh
      - name: Another ttsim release
        if: inputs.ttsim != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ttsim }}
        run: |
          # The checksum GitHub recorded for the release asset.
          digest="$(gh api "repos/tenstorrent/ttsim/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "libttsim_wh_x2.so") | .digest')"
          test -n "$digest"
          echo "${digest#sha256:}  libttsim_wh_x2.so" > ttsim.sha256
          echo "$TAG" > ttsim-version
          echo "ttsim $TAG on the N300 (pinned: $(git show HEAD:ttsim-version))" >> "$GITHUB_STEP_SUMMARY"
      - name: Two-chip simulator and N300 cluster descriptor
        env:
          DISCOVER: ${{ inputs.discover }}
        run: |
          bash scripts/setup_ttsim.sh n300
          # With a cluster file set, tt-metal hands it to UMD instead of letting
          # UMD discover the simulated chips and the Ethernet links between them.
          if [ "$DISCOVER" != "true" ]; then
            mkdir -p ~/.cache/tensixfuse
            curl -fsSL -o ~/.cache/tensixfuse/wormhole_N300.yaml \
              "https://raw.githubusercontent.com/tenstorrent/tt-umd/$UMD_SHA/tests/cluster_descriptor_examples/wormhole_N300.yaml"
            echo "TT_METAL_MOCK_CLUSTER_DESC_PATH=$HOME/.cache/tensixfuse/wormhole_N300.yaml" >> "$GITHUB_ENV"
          fi
      - run: python model/gpt2_capture.py --out data/gpt2_mlp.npz
      - name: Tensor-parallel MLP on the simulated N300
        env:
          FABRIC: ${{ inputs.fabric }}
          BLOCKS: ${{ inputs.blocks || '0 6 11' }}
        run: |
          args=()
          if [ "$FABRIC" != "true" ]; then args+=(--no-fabric); fi
          read -ra blocks <<< "$BLOCKS"
          python bench/tp_mlp_n300.py data/gpt2_mlp.npz --out results/tp_n300.json --blocks "${blocks[@]}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tp-n300
          path: results/
