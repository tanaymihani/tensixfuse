name: scaleout

# GPT-2's MLP tensor-parallel across the two chips of a simulated N300
# (ttsim's 2-chip Wormhole build), with a real all-reduce between them.
on:
  push:
    branches: [main, sim-bringup]
    paths:
      - "bench/tp_mlp_n300.py"
      - ".github/workflows/scaleout.yml"
  workflow_dispatch:

env:
  TTNN_VERSION: "0.79.0"
  # tt-umd as pinned by tt-metal v0.79.0 (tt_metal/third_party/umd)
  UMD_SHA: f9173df20bec9bb93e5c92407e701e604ddef33d

jobs:
  n300:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ttnn==$TTNN_VERSION"
          pip install transformers datasets "numpy<2"
          pip install --no-deps -e .
      - run: bash scripts/install_sfpi.sh
      - name: Two-chip simulator and N300 cluster descriptor
        run: |
          bash scripts/setup_ttsim.sh n300
          mkdir -p ~/.cache/tensixfuse
          curl -fsSL -o ~/.cache/tensixfuse/wormhole_N300.yaml \
            "https://raw.githubusercontent.com/tenstorrent/tt-umd/$UMD_SHA/tests/cluster_descriptor_examples/wormhole_N300.yaml"
          echo "TT_METAL_MOCK_CLUSTER_DESC_PATH=$HOME/.cache/tensixfuse/wormhole_N300.yaml" >> "$GITHUB_ENV"
      - run: python model/gpt2_capture.py --out data/gpt2_mlp.npz
      - name: Tensor-parallel MLP on the simulated N300
        run: python bench/tp_mlp_n300.py data/gpt2_mlp.npz --out results/tp_n300.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tp-n300
          path: results/
