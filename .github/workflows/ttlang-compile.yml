# The fusion study's TT-Lang kernels through the real TT-Lang compiler, run on
# ttsim. tt-lang 1.1.6 requires ttnn 0.74.0, so this job uses the simulator and
# SFPI that tt-metal 0.74.0 pins (pins/tt-lang-1.1.6), not the repo's main pins.
name: ttlang-compile

on:
  push:
    branches: [main]
    paths:
      - "kernels/ttlang/**"
      - "bench/ttlang_compiled.py"
      - "pins/tt-lang-1.1.6/**"
      - "scripts/install_sfpi.sh"
      - "scripts/setup_ttsim.sh"
      - ".github/workflows/ttlang-compile.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: "quick or fusion"
        default: "fusion"

env:
  TENSIXFUSE_PINS: pins/tt-lang-1.1.6

jobs:
  compile:
    name: TT-Lang compiler on simulated ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tt-lang (with its ttnn) and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tt-lang==1.1.6
          pip install --no-deps -e .
          pip list 2>/dev/null | grep -iE "^(tt-lang|ttnn|torch) "
      - run: bash scripts/install_sfpi.sh
      - run: bash scripts/setup_ttsim.sh ${{ matrix.arch }}
      - name: "Known-good kernel first: TT-Lang's matmul tutorial, step 1, at 64^3"
        continue-on-error: true
        run: |
          src="$(python -c 'import os, ttl.tutorials.matmul as m; print(os.path.dirname(m.__file__))')/step_1_single_node_single_tile_block.py"
          sed 's/M, K, N = 8192, 8192, 8192/M, K, N = 64, 64, 64/' "$src" > /tmp/tutorial_step1.py
          grep -n "M, K, N =" /tmp/tutorial_step1.py
          timeout 1200 python /tmp/tutorial_step1.py 2>&1 | grep -v "leaked\|nanobind" | tail -25
          echo "tutorial exit: ${PIPESTATUS[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile and run on ttsim
        run: python bench/ttlang_compiled.py --runs "${{ inputs.runs || 'fusion' }}" --out results/ttlang_compiled_${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttlang-compiled-${{ matrix.arch }}
          path: results/ttlang_compiled_*.json
