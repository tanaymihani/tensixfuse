name: kubernetes

# Runs a 4-shard version of the sweep as a JobSet on a throwaway kind cluster,
# from the Helm chart in deploy/helm, and merges the pods' results.
on:
  push:
    branches: [main, sim-bringup]
    paths:
      - "deploy/helm/**"
      - "docker/**"
      - "bench/fusion.py"
      - "bench/merge.py"
      - ".github/workflows/k8s.yml"
  workflow_dispatch:

env:
  JOBSET_VERSION: v0.12.0

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tensixfuse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: tensixfuse
      - name: Load the image and install JobSet
        run: |
          kind load docker-image tensixfuse:ci --name tensixfuse
          kubectl apply --server-side -f "https://github.com/kubernetes-sigs/jobset/releases/download/$JOBSET_VERSION/manifests.yaml"
          kubectl -n jobset-system rollout status deployment/jobset-controller-manager --timeout=5m
      - name: Lint and install the chart
        run: |
          helm lint deploy/helm/tensixfuse-sweep
          helm install sweep deploy/helm/tensixfuse-sweep \
            --set image.repository=tensixfuse --set image.tag=ci --set image.pullPolicy=Never \
            --set shards=4 --set "sizes={256,512}"
      - name: Wait for the JobSet
        run: |
          start=$(date +%s)
          kubectl wait --for=condition=Completed jobset/sweep --timeout=12m
          echo "JobSet finished in $(( $(date +%s) - start ))s"
          kubectl get pods -l app.kubernetes.io/instance=sweep -o wide
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get jobset,jobs,pods -o wide || true
          kubectl describe jobset sweep | tail -n 40 || true
          kubectl get events --sort-by=.lastTimestamp | tail -n 40 || true
          for p in $(kubectl get pods -l app.kubernetes.io/instance=sweep -o name); do
            echo "== $p"; kubectl logs "$p" --tail=30 || true
          done
      - name: Collect and merge the shards
        if: always()
        run: |
          mkdir -p logs
          for p in $(kubectl get pods -l app.kubernetes.io/instance=sweep -o name); do
            kubectl logs "$p" > "logs/${p#pod/}.log"
          done
          python3 bench/merge.py logs/*.log --expect 24 --out results/fusion_k8s.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-sweep
          path: |
            logs/
            results/
