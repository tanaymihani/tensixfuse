name: docker

# Builds the pinned simulator image, checks it on both simulated chips, and
# publishes it to GHCR from main and from release tags.
on:
  push:
    branches: [main, sim-bringup]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "src/**"
      - "scripts/**"
      - "ttsim-version"
      - "ttsim.sha256"
      - "sfpi-version"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tensixfuse

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: meta
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          sim=$(tr -d '[:space:]' < ttsim-version)
          tags="$IMAGE:${ver}-ttsim${sim#v},$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tensixfuse:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Health check and ttsim tests inside the image
        run: |
          docker image ls tensixfuse:test --format '{{.Size}}'
          for arch in blackhole wormhole; do
            docker run --rm -e TENSIXFUSE_ARCH=$arch tensixfuse:test tensixfuse-doctor
            docker run --rm -e TENSIXFUSE_ARCH=$arch tensixfuse:test pytest -q -m ttsim tests/test_ttsim.py
          done
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
