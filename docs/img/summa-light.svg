<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 432" width="980" height="432" role="img" aria-label="SUMMA-style multicast on a grid of cores">
<title>SUMMA-style multicast on a grid of cores</title>
<rect width="980" height="432" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Multicast: one core per row reads A, one per column reads B</text>
<text x="40" y="56" font-size="12" fill="#52514e">4×4 cores shown; the study runs 8×8. The pattern is tt-lang's SUMMA benchmark.</text>
