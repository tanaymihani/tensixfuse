<text x="54" y="84" font-size="11" fill="#52514e">from DRAM</text>
<rect x="510" y="104" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="528" y="114" font-size="12.5" fill="#0b0b0b">reads a row of A blocks from DRAM, multicasts it along its row</text>
<rect x="510" y="134" width="11" height="11" rx="2" fill="#eb6834"/>
<text x="528" y="144" font-size="12.5" fill="#0b0b0b">reads a column of B blocks, multicasts it down its column</text>
<rect x="510" y="164" width="11" height="11" rx="2" fill="#fcfcfb"/>
<text x="528" y="174" font-size="12.5" fill="#0b0b0b">(the corner core does both)</text>
<rect x="510" y="194" width="11" height="11" rx="2" fill="#f3f2ee"/>
<text x="528" y="204" font-size="12.5" fill="#0b0b0b">every other core gets A and B over the NoC</text>
<text x="510" y="254" font-size="12.5" fill="#52514e">Fused matmul + bias + ReLU at 1024³, 4×4 tile blocks per core, 64 cores:</text>
<text x="510" y="284" font-size="15" fill="#0b0b0b">every core reads its own A and B: <tspan font-weight="700">36 MiB</tspan> from DRAM</text>
<text x="510" y="312" font-size="15" fill="#0b0b0b">with multicast: <tspan font-weight="700">8 MiB</tspan>, each tensor read once</text>
</g>
</svg>
