<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 272" width="990" height="272" role="img" aria-label="How the repo runs: CI, images, checks, results">
<title>How the repo runs: CI, images, checks, results</title>
<rect width="990" height="272" fill="#1a1a19"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="20" y="30" font-size="13" fill="#c3c2b7">Every simulator, compiler and SDK version is pinned with a checksum.</text>
<rect x="20" y="148" width="150" height="64" rx="8" fill="#262624" stroke="#383835" stroke-width="1"/>
<text x="95.0" y="177.0" text-anchor="middle" font-size="15" font-weight="600" fill="#f0efec">git push</text>
<text x="95.0" y="195.0" text-anchor="middle" font-size="11" fill="#c3c2b7">PRs, main, weekly</text>
<rect x="210" y="52" width="300" height="200" rx="10" fill="#1d2f45" stroke="#3987e5" stroke-width="2"/>
<text x="226" y="80" font-size="15" font-weight="600" fill="#f0efec">GitHub Actions</text>
<text x="226" y="106" font-size="12" fill="#c3c2b7">lint + tests, Linux and macOS</text>
<text x="226" y="128" font-size="12" fill="#c3c2b7">ttsim: Wormhole, Blackhole × 3 formats</text>
<text x="226" y="150" font-size="12" fill="#c3c2b7">C++ build against tt-metal's SDK</text>
<text x="226" y="172" font-size="12" fill="#c3c2b7">studies, perplexity, TT-Lang compiler</text>
<text x="226" y="194" font-size="12" fill="#c3c2b7">the fusion sweep, 8 cost-balanced shards</text>
<text x="226" y="216" font-size="12" fill="#c3c2b7">the sweep as a JobSet on kind (Helm)</text>
<text x="226" y="238" font-size="12" fill="#c3c2b7">Ansible + Molecule: bare Ubuntu to sim node</text>
<line x1="170" y1="180" x2="203" y2="180" stroke="#c3c2b7" stroke-width="1.5"/>
<path d="M202,175.5 L210,180 L202,184.5 Z" fill="#c3c2b7"/>
<rect x="570" y="60" width="400" height="58" rx="10" fill="#262624" stroke="#383835"/>
<text x="584" y="84" font-size="14" font-weight="600" fill="#f0efec">Results</text>
<text x="584" y="104" font-size="12" fill="#c3c2b7">results/*.json, which bench/report.py turns into the docs</text>
<line x1="510" y1="152.0" x2="563" y2="89.0" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="566" cy="89.0" r="4" fill="#c3c2b7"/>
<rect x="570" y="140" width="400" height="58" rx="10" fill="#262624" stroke="#383835"/>
<text x="584" y="164" font-size="14" font-weight="600" fill="#f0efec">Images</text>
<text x="584" y="184" font-size="12" fill="#c3c2b7">2 images, each tested, then pushed to GHCR</text>
<line x1="510" y1="152.0" x2="563" y2="169.0" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="566" cy="169.0" r="4" fill="#c3c2b7"/>
<rect x="570" y="220" width="400" height="58" rx="10" fill="#262624" stroke="#383835"/>
<text x="584" y="244" font-size="14" font-weight="600" fill="#f0efec">Checks</text>
<text x="584" y="264" font-size="12" fill="#c3c2b7">PCC floors and DRAM-tile baselines gate every PR</text>
<line x1="510" y1="152.0" x2="563" y2="249.0" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="566" cy="249.0" r="4" fill="#c3c2b7"/>
</g>
</svg>
