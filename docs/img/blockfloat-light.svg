<rect x="40" y="91" width="112" height="7" fill="#2a78d6"/>
<text x="40" y="56" font-size="13" font-weight="600" fill="#0b0b0b">one 32×32 tile = four 16×16 faces</text>
<rect x="40" y="316" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="56" y="326" font-size="12" fill="#0b0b0b">16 values in a face row share one exponent</text>
<text x="360" y="72" font-size="13" font-weight="600" fill="#0b0b0b">bfloat16 <tspan font-weight="400" fill="#52514e">16 bits per value</tspan></text>
<rect x="360" y="78" width="552.96" height="26" rx="3" fill="#52514e" fill-opacity="0.45"/>
<text x="922.96" y="96" font-size="13" fill="#0b0b0b">2,048 B</text>
<text x="360" y="146" font-size="13" font-weight="600" fill="#0b0b0b">bfloat8_b <tspan font-weight="400" fill="#52514e">sign + 7-bit mantissa, 8.5 bits per value</tspan></text>
<rect x="360" y="152" width="16.28" height="26" rx="3" fill="#eb6834"/>
<rect x="378.28" y="152" width="275.48" height="26" rx="3" fill="#2a78d6"/>
<text x="663.76" y="170" font-size="13" fill="#0b0b0b">1,088 B</text>
<text x="360" y="220" font-size="13" font-weight="600" fill="#0b0b0b">bfloat4_b <tspan font-weight="400" fill="#52514e">sign + 3-bit mantissa, 4.5 bits per value</tspan></text>
<rect x="360" y="226" width="16.28" height="26" rx="3" fill="#eb6834"/>
<rect x="378.28" y="226" width="137.24" height="26" rx="3" fill="#2a78d6"/>
<text x="525.52" y="244" font-size="13" fill="#0b0b0b">576 B</text>
<rect x="360" y="294" width="11" height="11" rx="2" fill="#eb6834"/>
<text x="376" y="304" font-size="12" fill="#52514e">64 exponent bytes, one per 16 values</text>
<rect x="620" y="294" width="11" height="11" rx="2" fill="#2a78d6"/>
<text x="636" y="304" font-size="12" fill="#52514e">signs and mantissas</text>
