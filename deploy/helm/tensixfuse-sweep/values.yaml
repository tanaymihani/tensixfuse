# The sweep image: TT-Lang's functional simulator (docker/Dockerfile, --target sweep).
image:
  repository: ghcr.io/tanaymihani/tensixfuse-sweep
  tag: latest
  pullPolicy: IfNotPresent

# Pods run in parallel; pod i takes every shards-th configuration starting at i.
shards: 8
sizes: [256, 512, 1024, 2048]

# Each pod is one single-threaded simulator process.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

# A failed shard reruns the whole JobSet this many times before giving up.
maxRestarts: 1
ttlSecondsAfterFinished: 3600
