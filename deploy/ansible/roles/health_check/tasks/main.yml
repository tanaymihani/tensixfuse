# Known-answer checks on every simulated chip: a matmul against the host and a
# bit-exact bfloat8_b round trip. Fails the play if any chip is unhealthy.
- name: Report directory
  ansible.builtin.file:
    path: "{{ health_dir }}"
    state: directory
    mode: "0755"

- name: Run tensixfuse-doctor per simulated chip
  ansible.builtin.command:
    cmd: "{{ tensixfuse_venv }}/bin/tensixfuse-doctor --out {{ health_dir }}/health-{{ item.key }}.json"
    chdir: "{{ tensixfuse_src }}"
  environment:
    TT_METAL_SIMULATOR: "{{ ttsim_root }}/{{ ttsim_version }}/{{ item.key }}/{{ item.value.lib }}"
    TT_METAL_SLOW_DISPATCH_MODE: "1"
    TT_METAL_DISABLE_SFPLOADMACRO: "1"
  loop: "{{ ttsim_archs | dict2items }}"
  register: doctor
  changed_when: false

- name: Read the per-chip reports
  ansible.builtin.slurp:
    src: "{{ health_dir }}/health-{{ item.key }}.json"
  loop: "{{ ttsim_archs | dict2items }}"
  register: chip_reports

# A report, not configuration: it holds run timings, so it never counts as a change.
- name: Node report
  vars:
    chips: "{{ chip_reports.results | map(attribute='content') | map('b64decode') | map('from_json') | list }}"
  ansible.builtin.copy:
    dest: "{{ health_dir }}/health.json"
    content: >-
      {{ {'host': inventory_hostname,
          'healthy': chips | selectattr('healthy') | list | length == chips | length,
          'chips': chips} | to_nice_json }}
    mode: "0644"
  changed_when: false
